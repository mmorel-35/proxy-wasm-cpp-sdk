name: Publish to BCR

on:
  # Manual trigger for testing and initial setup
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish (e.g., v1.0.0)'
        required: true
        type: string
      registry_fork:
        description: 'GitHub repository fork of bazel-central-registry (e.g., username/bazel-central-registry)'
        required: true
        type: string
  # Automatic trigger on release (uncomment when ready)
  # release:
  #   types: [published]

jobs:
  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1
    with:
      tag_name: ${{ inputs.tag_name }}
      registry_fork: ${{ inputs.registry_fork }}
      attest: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
